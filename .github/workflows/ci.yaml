name: CI api cine

on:
  push:
    branches: [master]

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/api-cine:${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar-dependenciar
        run: npm ci

      - name: ejecucion-pruebas
        run: npm test

  docker:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-build
        run: docker build -f ./Dockerfile -t "$IMAGEN" .

      - name: inicio-sesion-docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: push-a-docker
        run: docker push "$IMAGEN"
        run: echo "imagen subida a docker hub"